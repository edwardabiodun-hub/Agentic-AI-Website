name: Weekly SEO intelligence

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional inclusive start date (YYYY-MM-DD)"
        required: false
        type: string
      end_date:
        description: "Optional inclusive end date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  weekly-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run weekly intelligence cycle
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_ID: ${{ vars.SITE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          if [ -n "${{ inputs.end_date }}" ]; then
            uv run seo-engine run-weekly --run-date "${{ inputs.end_date }}"
          else
            uv run seo-engine run-weekly
          fi
      - name: Upload briefs and run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-seo-artifacts
          path: artifacts/
          if-no-files-found: warn

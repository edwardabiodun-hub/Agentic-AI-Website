name: Weekly SEO intelligence

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional inclusive start date (YYYY-MM-DD)"
        required: false
        type: string
      end_date:
        description: "Optional inclusive end date (YYYY-MM-DD)"
        required: false
        type: string
      fixture:
        description: "Use deterministic fixtures instead of live provider APIs"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  weekly-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Prepare Google service-account credentials
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            credential_path="$RUNNER_TEMP/google-service-account.json"
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$credential_path"
            chmod 600 "$credential_path"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$credential_path" >> "$GITHUB_ENV"
          fi
      - name: Run weekly intelligence cycle
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: Agentic-AI-Website
          SITE_ID: ${{ vars.SITE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          TARGET_SITE_ROOT: .
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          SEO_KEYWORDS: ${{ vars.SEO_KEYWORDS }}
          DATAFORSEO_LOCATION_CODE: ${{ vars.DATAFORSEO_LOCATION_CODE }}
          DATAFORSEO_LANGUAGE_CODE: ${{ vars.DATAFORSEO_LANGUAGE_CODE }}
          DATAFORSEO_DEVICE: ${{ vars.DATAFORSEO_DEVICE }}
          CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          args=()
          if [ -n "${{ inputs.end_date }}" ]; then
            args+=(--run-date "${{ inputs.end_date }}")
          fi
          if [ "${{ inputs.fixture }}" = "true" ]; then
            args+=(--fixture)
          fi
          if [ "${{ inputs.fixture }}" = "true" ] || [ -n "${{ inputs.end_date }}" ]; then
            uv run seo-engine run-weekly "${args[@]}" --propose-pr
          else
            uv run seo-engine run-weekly --propose-pr
          fi
      - name: Upload briefs and run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-seo-artifacts
          path: artifacts/
          if-no-files-found: warn

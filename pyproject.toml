[project]
name = "agentic-seo-engine"
version = "0.1.0"
description = "Evidence-backed autonomous SEO growth engine"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "firecrawl-py>=2.16,<3",
  "google-analytics-data>=0.19,<1",
  "google-api-python-client>=2.180,<3",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "openai>=1.99,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "typer>=0.16,<1",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
seo-engine = "seo_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/seo_engine"]

[tool.pytest.ini_options]
pythonpath = ["engine"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.test-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
